name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

# httpmech 依赖同级的 ../netmech，所以两个仓都检出到同一个 workspace：
#   $GITHUB_WORKSPACE/httpmech   ← 本仓
#   $GITHUB_WORKSPACE/netmech    ← 依赖
# CMake 默认就在 ../netmech 找它，不用额外传 -DHTTPMECH_NETMECH_DIR。

jobs:
  # ---------------------------------------------------------------------------
  # Linux / GCC + Clang
  # ---------------------------------------------------------------------------
  linux:
    name: Linux / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]

    steps:
      - name: 检出 httpmech
        uses: actions/checkout@v4
        with:
          path: httpmech

      - name: 检出 netmech（依赖）
        uses: actions/checkout@v4
        with:
          repository: goldhalo/netmech
          path: netmech

      - name: 安装工具
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            sudo apt-get install -y g++
          else
            # 用 runner 预装的 clang：apt 装 clang++ 常因版本被钉死而失败
            # （clang++ : Depends: clang (= 1:14.0-...) but 1:18.x is to be installed）
            clang++ --version || { echo "::error::runner 上没有预装 clang++"; exit 1; }
          fi

      - name: 配置
        working-directory: httpmech
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            export CC=gcc CXX=g++
          else
            export CC=clang CXX=clang++
          fi
          cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DHTTPMECH_WARNINGS_AS_ERRORS=ON

      - name: 构建
        working-directory: httpmech
        run: cmake --build build --parallel

      - name: 测试
        working-directory: httpmech
        run: ctest --test-dir build --output-on-failure --timeout 120

      - name: 直接运行测试（失败时取详细输出）
        if: failure()
        working-directory: httpmech
        run: ./build/bin/httpmech_ut || true

  # ---------------------------------------------------------------------------
  # Windows / MSVC
  #   e2e 用例是 POSIX socket，Windows 上会被 #if 掉；这里主要验证
  #   MSVC 能编过（/utf-8、/W4、模板实例化），以及纯逻辑单测能跑。
  #
  #   生成器用 Ninja 而**不用** Visual Studio 生成器，原因：
  #   前者先报 "could not find any instance of Visual Studio"（镜像里 VS 换版本了），
  #   改成运行时探测后能找到 VS，又报 "Failed to run MSBuild command: MSBuild.exe
  #   ... no such file"。与其跟 VS 生成器的探测逻辑搏斗，不如用 msvc-dev-cmd
  #   把 cl 的环境变量摆好再走 Ninja —— 这也更接近本地能复现的构建方式。
  # ---------------------------------------------------------------------------
  windows:
    name: Windows / MSVC / ${{ matrix.build_type }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - name: 检出 httpmech
        uses: actions/checkout@v4
        with:
          path: httpmech

      - name: 检出 netmech（依赖）
        uses: actions/checkout@v4
        with:
          repository: goldhalo/netmech
          path: netmech

      - name: 配置 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 说明：把 cmake 的输出抓下来，失败时用 ::error:: 打到 annotation 上。
      # 原因：Actions 的原始日志要通过 API 取需要仓库管理员权限，
      # 而 annotation 是公开可读的 —— 排查 CI 失败时这点很关键。
      - name: 配置
        working-directory: httpmech
        shell: pwsh
        run: |
          $out  = cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DHTTPMECH_WARNINGS_AS_ERRORS=ON 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) {
            $lines = $out -split "`r?`n"
            $idx = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match 'CMake Error') { $idx = $i; break }
            }
            if ($idx -ge 0) {
              $end  = [Math]::Min($idx + 7, $lines.Count - 1)
              $errs = ($lines[$idx..$end] | Where-Object { $_.Trim() -ne '' }) -join ' | '
            } else {
              $errs = (($lines | Where-Object { $_.Trim() -ne '' }) | Select-Object -Last 8) -join ' | '
            }
            Write-Host "::error title=Windows configure failed::$errs"
            exit 1
          }

      - name: 构建
        working-directory: httpmech
        shell: pwsh
        run: |
          $out  = cmake --build build --parallel 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) {
            $line = ($out -split "`r?`n" | Where-Object { $_ -match 'error C|: fatal|error MSB' } | Select-Object -First 2) -join ' | '
            Write-Host "::error title=Windows build failed::$line"
            exit 1
          }

      - name: 测试
        working-directory: httpmech
        shell: pwsh
        run: |
          $exe = ".\build\bin\httpmech_ut.exe"
          if (-not (Test-Path $exe)) { Write-Host "::error::找不到 $exe"; exit 1 }
          $out  = & $exe 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) {
            $line = ($out -split "`r?`n" | Where-Object { $_ -match 'FAIL' } | Select-Object -First 3) -join ' | '
            Write-Host "::error title=Windows 单测失败::$line"
            exit 1
          }

  # ---------------------------------------------------------------------------
  # 安装 / find_package 冒烟测试
  #   装到临时前缀，再写一个最小消费者工程用 find_package 找到它。
  #   这条能抓住"能编过但装出去用不了"的一类问题（路径、EXPORT、依赖）。
  # ---------------------------------------------------------------------------
  install:
    name: install + find_package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出 httpmech
        uses: actions/checkout@v4
        with:
          path: httpmech

      - name: 检出 netmech（依赖）
        uses: actions/checkout@v4
        with:
          repository: goldhalo/netmech
          path: netmech

      - name: 安装 netmech 与 httpmech
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build g++
          cmake -S netmech -B netmech/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/tmp/pfx -DNETMECH_BUILD_TESTS=OFF -DNETMECH_BUILD_EXAMPLES=OFF
          cmake --build netmech/build --parallel
          cmake --install netmech/build

          cmake -S httpmech -B httpmech/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/tmp/pfx -DHTTPMECH_BUILD_TESTS=OFF -DHTTPMECH_BUILD_EXAMPLES=OFF
          cmake --build httpmech/build --parallel
          cmake --install httpmech/build

      - name: 消费者工程（find_package）
        run: |
          mkdir -p /tmp/consumer
          cat > /tmp/consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          project(consumer CXX)
          set(CMAKE_CXX_STANDARD 17)
          find_package(httpmech REQUIRED)
          add_executable(app main.cpp)
          target_link_libraries(app PRIVATE httpmech::httpmech)
          EOF

          cat > /tmp/consumer/main.cpp <<'EOF'
          #include <httpmech/httpmech.hpp>
          int main()
          {
              // 只用到不需要实现的纯函数，验证头文件 + 链接路径都对
              return httpmech::make_websocket_accept("dGhlIHNhbXBsZSBub25jZQ==") ==
                             "s3pPLMBiTxaQ9kYGzzhZRbK+xOo="
                         ? 0
                         : 1;
          }
          EOF

          cmake -S /tmp/consumer -B /tmp/consumer/build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/tmp/pfx
          cmake --build /tmp/consumer/build
          /tmp/consumer/build/app

  # ---------------------------------------------------------------------------
  # ASan + UBSan
  #
  # 为什么要单独跑一遍：越界读和"无符号下溢"在 Release 上通常**没有任何症状** ——
  # 读到垃圾数据被当成未知字段跳过，或者循环多转几圈但结果碰巧对。
  # 2026-11 就出过一次：mpegmech 的 test_g711_ps 在 Windows Debug 上卡 120 秒，
  # 根因是 `in[code_at]` 越界读 + `in.size() - scan` 下溢；Linux Release 一直绿。
  #
  # 关掉 detect_leaks：库里有些对象是刻意长命的（进程级 io 池等），
  # 让 LeakSanitizer 报它们只会训练大家忽略告警。
  # ---------------------------------------------------------------------------
  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 注意：httpmech 依赖同级的 ../netmech，必须像其它 job 一样把两个仓
      # 都检出到同一个 workspace（httpmech/ 与 netmech/）。
      # 只检出本仓时 ../netmech 不存在，配置阶段直接 FATAL_ERROR。
      - name: 检出 httpmech
        uses: actions/checkout@v4
        with:
          path: httpmech

      - name: 检出 netmech（依赖）
        uses: actions/checkout@v4
        with:
          repository: goldhalo/netmech
          path: netmech

      - name: 安装工具
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: 配置（Debug + sanitizer）
        working-directory: httpmech
        run: |
          cmake -S . -B build-san -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
                -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
                -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
                -DHTTPMECH_BUILD_TESTS=ON

      - name: 构建
        working-directory: httpmech
        run: cmake --build build-san --parallel

      - name: 测试（sanitizer 一旦报错立即失败）
        working-directory: httpmech
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          LSAN_OPTIONS: detect_leaks=0
        # 失败时把关键行打进 annotation（原始日志要管理员权限才取得到）
        run: |
          set +e
          ctest --test-dir build-san --output-on-failure --timeout 300 2>&1 | tee /tmp/san.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            line=$(grep -m1 -E "ERROR: AddressSanitizer|runtime error|SEGV|FAIL\]|Timeout" /tmp/san.log | cut -c1-320)
            [ -z "$line" ] && line=$(tail -5 /tmp/san.log | tr '\n' ' ')
            echo "::error title=sanitizer 失败::$line"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # 质量门禁
  # ---------------------------------------------------------------------------
  quality:
    name: 质量检查
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: 检查禁止的 C++20 特性
        run: |
          FAIL=0
          # 只看代码，跳过纯注释行（span.hpp 的说明里就提到过 std::span）
          for pat in 'co_await' 'co_return' 'co_yield' 'std::span' 'std::format' \
                     'std::jthread' 'std::atomic_ref' '\bconcept\b' '\branges::' '<=>'; do
            hits=$(grep -rEn "$pat" include/ src/ example/ test/ \
                     --include='*.hpp' --include='*.cpp' 2>/dev/null \
                   | grep -vE '^[^:]+:[0-9]+:[[:space:]]*//' || true)
            if [ -n "$hits" ]; then
              echo "❌ 发现禁止的构造: $pat"
              echo "$hits"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 1 ]; then exit 1; fi
          echo "✅ 未发现 C++20 构造"

      - name: 检查不得引入 Boost / OpenSSL
        run: |
          # 只看 #include：注释里提到 boost::beast 是在讲"我们为什么不用它"，
          # 不该算依赖（之前这条因为注释里的 boost:: 误报过一次）。
          if grep -rnE '^[[:space:]]*#[[:space:]]*include[[:space:]]*<(boost|openssl)/' \
               include/ src/ example/ test/ --include='*.hpp' --include='*.cpp'; then
            echo "❌ 发现有 boost / openssl 的 #include（本库零外部依赖）"
            exit 1
          fi
          # 顺带拦住 netmech 之外的第二份 asio（我们自己用的那份在 netmech 里）
          if grep -rnE '^[[:space:]]*#[[:space:]]*include[[:space:]]*<(asio|asio\.hpp)' \
               include/ src/ example/ --include='*.hpp' --include='*.cpp'; then
            echo "❌ 发现直接 #include asio（应通过 netmech 的头间接使用）"
            exit 1
          fi
          echo "✅ 无 Boost / OpenSSL 依赖"

      - name: 检查对外头文件不依赖 Asio
        run: |
          # 装出去的包**不带 Asio**（公共头一行 asio 都不引，asio 只在 src/ 里用）。
          # 一旦有人在 include/ 里加回 `#include <asio/...>`，使用者就得自己装
          # 一套 Asio 才编得过 —— 这条检查用来守住这个边界。
          if grep -rnE '^[[:space:]]*#[[:space:]]*include[[:space:]]*<(asio|asio\.hpp)' \
               include/ --include='*.hpp'; then
            echo "❌ 对外头文件包含了 asio（装出去的包不该依赖它）"
            exit 1
          fi
          echo "✅ 对外头文件无 asio 依赖"

      - name: 检查每个对外头文件可单独包含
        run: |
          sudo apt-get update && sudo apt-get install -y g++
          git clone --depth 1 https://github.com/goldhalo/netmech /tmp/netmech
          FAIL=0
          for h in include/httpmech/*.hpp; do
            name=$(basename "$h" .hpp)
            printf '#include <httpmech/%s.hpp>\nint main(){return 0;}\n' "$name" > /tmp/one.cpp
            if ! g++ -std=c++17 -fsyntax-only -Wall -Wextra \
                 -Iinclude -I/tmp/netmech/include -I/tmp/netmech/thirdparty/asio/include \
                 /tmp/one.cpp; then
              echo "❌ $name.hpp 不能单独包含"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 1 ]; then exit 1; fi
          echo "✅ 全部头文件自包含"
